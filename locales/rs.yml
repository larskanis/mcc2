  open_layout_invalid_datasource_encoding: |
    Кодирање извора података подешено на „%{datasource_encoding}“ је неважеће.

    Важеће вредности су „%{valid_encodings}“.

    Молимо вас да подесите исправно кодирање у својствима распореда
    и сачувате подешавања.
  open_layout_invalid_datasource_type: |
    Врста извора података „%{datasourcetyp}“ је неважећа.

    Важеће вредности су „%{valid_types}“.

    Вредност је сада постављена на подразумевану вредност „%{new}“.

    Подесите тачну врсту извора података у својствима распореда
    и сачувајте подешавања.
  open_layout_old_barby: |
    Ова датотека и даље користи Barby бар-кодове уместо новијих Zint бар-кодова.

    Због тога се сви бар-кодови морају проверити и, ако је потребно, поново подесити!

    Ово упозорење ће нестати када се датотека сачува.
  open_layout_old_text_box: |
    Ова датотека и даље садржи текстуалне објекте без обзира на величину оквира.

    Величина оквира текстуалних објеката је сада аутоматски подешена на величину узорка текста.

    Међутим, могу бити потребна подешавања за променљиве податке.

    Молимо вас да проверите да ли је сав текст правилно позициониран.
  open_layout_version_error: Датотека %{filename} је структурирана према верзији %{filever}, али овај програм може да обрађује само верзије %{supported}.
