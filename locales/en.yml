    textfield_data_non_text_tipText: |-
      Contains the data that will later be printed on the card.
      Only 1 line can be entered in this field.
      Placeholders from a data source are formed according to the syntax
      {fieldname[start,length]}.
    textfield_data_tipText: |-
      Contains the data to be printed on the card later.
      Multiple lines can be entered in this field.
      Placeholders from a data source are formed according to the syntax
      {fieldname[start,length]}.
    textfield_fontsize_tipText: Here the font size is set in points. It is also possible to specify real numbers (using a period as the decimal separator).
    textfield_height_tipText: This value is the height of the object. Currently, it only has an effect on images.
    textfield_name_tipText: The name is only necessary for the display in the object list and for certain actions, but should nevertheless be changed to a meaningful name.
    textfield_page_height_tipText: This value shifts the entire print image along the Y-axis.
    textfield_page_width_tipText: This value shifts the entire print image along the Y-axis.
    textfield_rotation_tipText: This value specifies the angle by which the object is to be rotated. Real numbers are also possible (with a decimal point as the separator).
    textfield_sample_data_tipText: |-
      Contains the data to be printed on the card later.
      Multiple lines can be entered in this field.
      Placeholders from a data source are formed according to the syntax
      {fieldname[start,length]}.
    textfield_text_color_tipText: Here, the font color can be entered as a hexadecimal value. To select a color, use the button on the right.
    textfield_width_tipText: This value specifies the width of the object. For text fields, this value currently only has an effect if the alignment is set to center or right.
    textfield_x_offset_tipText: This value shifts the entire print image along the X-axis.
    textfield_x_tipText: This value indicates the distance of the object from the left side of the map.
    textfield_y_offset_tipText: This value shifts the entire print image along the Y-axis.
    textfield_y_tipText: This value specifies the distance of the object from the top edge of the map. For text fields, this value refers to the bottom edge of the text.
