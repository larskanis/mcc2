      In diesem Feld kann nur 1 Zeile eingegeben werden.
      Platzhalter aus einer Datenquelle werden nach der Syntax
      {feldname[anfang,laenge]} gebildet.
    textfield_data_tipText: |-
      Enthält die Daten, welche später auf der Karte gedruckt werden sollen.
      In diesem Feld können mehrerer Zeilen eingegeben werden.
      Platzhalter aus einer Datenquelle werden nach der Syntax
      {feldname[anfang,laenge]} gebildet.
    textfield_fontsize_tipText: Hier wird die Schriftgröße in Punkt eingestellt. Es ist auch die Angabe von Realzahlen möglich (Punkt als Dezimaltrenner)
    textfield_height_tipText: Dieser Wert ist die Höhe des Objekts. Er hat momentan nur bei Bildern einen Einfluss.
    textfield_name_tipText: Der Name ist nur für die Anzeige in der Objektliste und bei bestimmten Aktionen notwendig, sollte aber dennoch in einen aussagekräftigen Namen geändert werden.
    textfield_page_height_tipText: Mit diesem Wert wird das gesamte Druckbild um die Y-Achse verschoben.
    textfield_page_width_tipText: Mit diesem Wert wird das gesamte Druckbild um die Y-Achse verschoben.
    textfield_rotation_tipText: Dieser Wert kennzeichnet den Winkel, um den das Objekt gedreht werden soll. Es sind auch Realzahlen möglich (mit Punkt als Dezimaltrenner).
    textfield_sample_data_tipText: |-
      Enthält die Daten, welche später auf der Karte gedruckt werden sollen.
      In diesem Feld können mehrerer Zeilen eingegeben werden.
      Platzhalter aus einer Datenquelle werden nach der Syntax
      {feldname[anfang,laenge]} gebildet.
    textfield_text_color_tipText: Hier kann die Schriftfarbe als Hexadezimalwert eingetragen werden. Um eine Farbe auszuwählen, nutzen Sie den Button rechts.
    textfield_width_tipText: Dieser Wert bezeichnet die Breite des Objektes. Bei Textfeldern hat dieser Wert momentan nur einen Einfluss, wenn die Ausrichtung Mitte oder Rechts gewählt wurde.
    textfield_x_offset_tipText: Mit diesem Wert wird das gesamte Druckbild um die X-Achse verschoben.
    textfield_x_tipText: Dieser Wert bezeichnet den Abstand des Objekts von der linken Kartenseite.
    textfield_y_offset_tipText: Mit diesem Wert wird das gesamte Druckbild um die Y-Achse verschoben.
    textfield_y_tipText: Dieser Wert bezeichnet den Abstand des Objekts von der Oberkannte der Karte. Bei Textfeldern ist dieser Wert bezogen auf die Unterkante des Textes.
